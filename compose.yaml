services:
  web:
    build: .
    environment:
      - WEB_ADDR=${WEB_ADDR}
      - WEB_DSN=${WEB_DSN}
    ports:
      - 4000:4000
    depends_on:
      mysql:
        condition: service_healthy
  
  mysql:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - 3306:3306
    volumes:
      - my-mysql-volume:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -u root -p$${MYSQL_ROOT_PASSWORD}
      start_interval: 1s
      start_period: 10s
      interval: 1m
      timeout: 3s
      retries: 5

volumes:
  my-mysql-volume: